<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, iniitial-scale=1.0">
    <title>Height Input</title>
    <style>
        .height-input {
            display: flex; /*Arranges elements horizontally */
            gap: 10px; /*Adds spacing between each element */
        }
        .height-input select, .height-input input {
            padding: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- Registration form-->
     <form id="register-form">

        <label for="height">Height:</label>
        <div class="height-input">
            <!-- Dropdown for feet selection -->
             <select id="height-feet">
                <option value="" disabled selected>Feet</option> <!-- Placeholder text -->
                <option value="3">3'</option>
                <option value="4">4'</option>
                <option value="5">5'</option>
                <option value="6">6'</option>
                <option value="7">7'</option>
             </select>

             <!-- Dropdown for inches selection -->
              <select id="height-inches">
                <option value="" disabled selected>Inches</option> <!-- Placeholder text -->
                <option value="0">0"</option>
                <option value="1">1"</option>
                <option value="2">2"</option>
                <option value="3">3"</option>
                <option value="4">4"</option>
                <option value="5">5"</option>
                <option value="6">6"</option>
                <option value="7">7"</option>
                <option value="8">8"</option>
                <option value="9">9"</option>
                <option value="10">10"</option>
                <option value="11">11"</option>
              </select>

              <!-- Text input for manual height entry-->
               <input type="text" id="height-text" placeholder="Or type (e.g., 5'8)" maxlength="5">
        </div>
        <!-- Submit button for the form -->
         <button type="Submit">Submit</button>
     </form>

     <script>
        // Always includes apostrophe after feet
        const heightInput = document.getElementById("height-text");
        heightInput.addEventListener("input", () => {
            let value = heightInput.value.replace(/[^0-9']/g, ""); // Removes invalid characters

            // Automatically adds apostrphe after first digit of feet
            if (value.length > 0 && !value.includes("'")) {
                value = value [0] + "'"; //Apostrophe added after first digit
            }

            const formatted = value.replace(/^(\d+)'?(\d*)$/, (_, feet, inches) => {
                return feet + "'" + (inches || ""); // Add inches after the apostrophe 
            });

            heightInput.value = formatted; 
        });

            // Handle form submission and validate input
            const form = document.getElementById("register-form");
            form.addEventListener("submit", (e) => {
                e.preventDefault(); 
                
                const feet = document.getElementById("height-feet").value; //Selected feet
                const inches = document.getElementById("height-inches"). value; //Selected inches
                const typedHeight = heightInput.value; //Typed value of height

                // Determine the final height to submit
                 let finalHeight = typedHeight || `${feet || "?"}'${inches || "?"}"`;

                //If no valid height is provided, show an error message

                if (!typedHeight && (!feet || !inches)) {
                    alert ("Please provide a valid integer for your height!"); // Error mmessage displayed
                    return;
                }

                // Display submitted height
                alert("Submitted height: " + finalHeight); 

            });
     </script>
</body>
</html>
